name: fkit-bi
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [default]
  analytics:
    image: ${ANALYTICS_IMAGE}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FKIT_BI_GIT_SHA: ${GIT_SHA}
      FKIT_JWT_SECRET: ${FKIT_JWT_SECRET}
      FKIT_TRUSTED_PROXY_CIDRS: ${FKIT_TRUSTED_PROXY_CIDRS:-${PROXY_CONTAINER_IP:-172.29.0.250}/32}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"], interval: 10s, timeout: 3s, retries: 12}
    restart: unless-stopped
  generator:
    image: ${GENERATOR_IMAGE}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FKIT_BI_GIT_SHA: ${GIT_SHA}
      FKIT_JWT_SECRET: ${FKIT_JWT_SECRET}
    depends_on:
      postgres: {condition: service_healthy}
      analytics: {condition: service_healthy}
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"], interval: 10s, timeout: 3s, retries: 12}
    restart: unless-stopped
  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
  cert-setup:
    build: ./certbot
    image: fkit-bi-certbot:local
    environment:
      TLS_MODE: ${TLS_MODE:-off}
      CERTBOT_CHALLENGE: ${CERTBOT_CHALLENGE:-dns-01}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      DNS_ZONE_ID: ${DNS_ZONE_ID:-}
      DNS_RECORD_NAME: ${DNS_RECORD_NAME:-_acme-challenge.bi.kitexp.ru.}
      DNS_PROPAGATION_WAIT_SECONDS: ${DNS_PROPAGATION_WAIT_SECONDS:-20}
      YANDEX_SERVICE_ACCOUNT_ID: ${YANDEX_SERVICE_ACCOUNT_ID:-}
      YANDEX_KEY_ID: ${YANDEX_KEY_ID:-}
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-challenges:/var/www/certbot
      - ./certbot:/opt/fkit/certbot:ro
      - type: bind
        source: ${YANDEX_SERVICE_ACCOUNT_KEY_FILE:-./certbot/yandex-key.example.json}
        target: /run/secrets/yandex-service-account-key.json
        read_only: true
    entrypoint: ["/bin/sh", "/opt/fkit/certbot/setup.sh"]
    restart: "no"
  cert-renew:
    image: fkit-bi-certbot:local
    environment:
      TLS_MODE: ${TLS_MODE:-off}
      CERTBOT_CHALLENGE: ${CERTBOT_CHALLENGE:-dns-01}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      DNS_ZONE_ID: ${DNS_ZONE_ID:-}
      DNS_RECORD_NAME: ${DNS_RECORD_NAME:-_acme-challenge.bi.kitexp.ru.}
      YANDEX_SERVICE_ACCOUNT_ID: ${YANDEX_SERVICE_ACCOUNT_ID:-}
      YANDEX_KEY_ID: ${YANDEX_KEY_ID:-}
      DNS_PROPAGATION_WAIT_SECONDS: ${DNS_PROPAGATION_WAIT_SECONDS:-20}
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-challenges:/var/www/certbot
      - ./certbot:/opt/fkit/certbot:ro
      - type: bind
        source: ${YANDEX_SERVICE_ACCOUNT_KEY_FILE:-./certbot/yandex-key.example.json}
        target: /run/secrets/yandex-service-account-key.json
        read_only: true
    depends_on:
      cert-setup: {condition: service_completed_successfully}
      proxy: {condition: service_started}
    pid: "service:proxy"
    entrypoint: ["/bin/sh", "/opt/fkit/certbot/renew.sh"]
    restart: unless-stopped
  proxy:
    image: nginx:1.27-alpine
    networks:
      default:
        # Keep the fixed proxy address away from Docker's low dynamic allocations
        # (the web container is started first and otherwise receives .2).
        ipv4_address: ${PROXY_CONTAINER_IP:-172.29.0.250}
      infisical-edge: {}
    ports:
      - "80:80"
      - "443:443"
    environment:
      TLS_MODE: ${TLS_MODE:-off}
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/tls.conf.template:/etc/nginx/tls.conf.template:ro
      - ./nginx/start.sh:/opt/fkit/nginx/start.sh:ro
      - certbot-data:/etc/letsencrypt:ro
      - certbot-challenges:/var/www/certbot:ro
    command: ["/bin/sh", "/opt/fkit/nginx/start.sh"]
    depends_on:
      cert-setup: {condition: service_completed_successfully}
      web: {condition: service_started}
    restart: unless-stopped
  infisical:
    image: infisical/infisical:v0.165.16
    environment:
      NODE_ENV: production
      SITE_URL: https://secrets.kitexp.ru
      DB_CONNECTION_URI: postgresql://${INFISICAL_POSTGRES_USER}:${INFISICAL_POSTGRES_PASSWORD}@infisical-postgres:5432/${INFISICAL_POSTGRES_DB}
      REDIS_URL: redis://infisical-redis:6379
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?INFISICAL_ENCRYPTION_KEY is required}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:?INFISICAL_AUTH_SECRET is required}
      TELEMETRY_ENABLED: "false"
      ANNOUNCEMENTS_ENABLED: "false"
      OTEL_TELEMETRY_COLLECTION_ENABLED: "false"
    expose: [8080]
    depends_on:
      infisical-postgres: {condition: service_healthy}
      infisical-redis: {condition: service_healthy}
    networks: [infisical-data, infisical-edge]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/status"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: unless-stopped
  infisical-postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${INFISICAL_POSTGRES_DB:?INFISICAL_POSTGRES_DB is required}
      POSTGRES_USER: ${INFISICAL_POSTGRES_USER:?INFISICAL_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${INFISICAL_POSTGRES_PASSWORD:?INFISICAL_POSTGRES_PASSWORD is required}
    volumes: [infisical-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [infisical-data]
    restart: unless-stopped
  infisical-redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [infisical-redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [infisical-data]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-grafana.bi.kitexp.ru}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.bi.kitexp.ru/}
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: {condition: service_started}
    restart: unless-stopped
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    restart: unless-stopped
  analytics-bootstrap:
    extends:
      service: analytics
    command: ["bootstrap-user"]
    environment:
      FKIT_BOOTSTRAP_USERNAME: ${FKIT_BOOTSTRAP_USERNAME:-}
      FKIT_BOOTSTRAP_DISPLAY_NAME: ${FKIT_BOOTSTRAP_DISPLAY_NAME:-}
      FKIT_BOOTSTRAP_PASSWORD: ${FKIT_BOOTSTRAP_PASSWORD:-}
    profiles: ["bootstrap"]
    restart: "no"
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.29.0.0/24}
  infisical-data:
    internal: true
  infisical-edge:
volumes:
  postgres-data:
  certbot-data:
  certbot-challenges:
  prometheus-data:
  grafana-data:
  infisical-postgres-data:
  infisical-redis-data:
