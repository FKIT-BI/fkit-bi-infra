groups:
  - name: fkit-bi-runtime
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Prometheus target is down"
          description: "Target {{ $labels.job }} at {{ $labels.instance }} is unavailable."
      - alert: DroppedMeasurements
        expr: increase(fkit_bi_ingest_measurements_total{outcome="dropped"}[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: "Measurements were dropped"}
      - alert: ProjectionLagHigh
        expr: fkit_bi_projection_lag_seconds{projection=~"current_signal|machine_state"} > 30
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Current projection lag is above 30 seconds"}
      - alert: MinuteRollupLagHigh
        expr: fkit_bi_projection_lag_seconds{projection="minute_rollup"} > 180
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Minute rollup lag is above 180 seconds"}
      - alert: DirtyWindowAgeHigh
        expr: fkit_bi_dirty_oldest_age_seconds > 300
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Oldest dirty window is above 5 minutes"}
      - alert: ApiServerErrors
        expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.01) and (sum(increase(http_server_requests_seconds_count[5m])) >= 100)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "API 5xx ratio is above 1 percent"}
      - alert: ApiLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, application, uri) (rate(http_server_requests_seconds_bucket{uri=~".*/(current|overview).*"}[5m]))) > 1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "API p95 latency is above one second"}
      - alert: HikariPoolPressure
        expr: (hikaricp_connections_active / clamp_min(hikaricp_connections_max, 1) > 0.8) or (hikaricp_connections_pending > 0)
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Hikari connection pool is under pressure"}
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / clamp_min(max(pg_settings_max_connections), 1) > 0.8
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "PostgreSQL connections exceed 80 percent of capacity"}
      - alert: CalculationJobsFailed
        expr: increase(fkit_bi_calculation_jobs_total{outcome="failed"}[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: "A calculation job failed"}
      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: "PostgreSQL deadlocks increased"}
      - alert: FilesystemSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) < 0.2
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Filesystem free space is below 20 percent"}
      - alert: FilesystemSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) < 0.1
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Filesystem free space is below 10 percent"}
      - alert: RawPartitionHorizonLow
        expr: fkit_bi_partition_horizon_days < 2
        labels: {severity: critical}
        annotations: {summary: "Raw telemetry partition horizon is below two days"}
